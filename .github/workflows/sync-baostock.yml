name: Sync BaoStock closes

on:
  schedule:
    - cron: '30 11 * * 1-5'
  workflow_dispatch:
    inputs:
      full_repair:
        description: 'Force a full 300-session refresh'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/sync_baostock.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FULL_REPAIR: ${{ inputs.full_repair || 'false' }}
